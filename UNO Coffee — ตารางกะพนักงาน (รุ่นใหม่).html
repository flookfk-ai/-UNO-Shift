<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UNO Coffee — ตารางกะพนักงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: espresso header + tab row; one work surface per page; roster grid is the hero. Phone: tabs move to a bottom bar. */
:root{
  --bg:#F8F7F2; --surface:#FFFFFF; --surface-2:#F4F1E6; --line:#E1E0D8; --line-2:#ECEAE2;
  --fg:#1C1B18; --muted:#77756D; --head:#F8F7F2; --head-2:#F8F7F2; --head-fg:#1C1B18; --head-dim:#77756D; --head-on:#EDEAE0;
  --brand:#BB2A04; --brand-soft:#F6E3DC; --cream:#E9E3C8;
  --accent:#A86E0C; --accent-soft:#FBF0D9; --accent-line:#E8CC8E; --accent-fg:#FFFFFF;
  --bad:#C0392B; --bad-bg:#FBE5E1; --ok:#2C7A4B; --ok-bg:#DFF0E3; --warn:#8F6100; --warn-bg:#FAEFD3;
  --off:#8A9096; --hatch:#EEEBE0; --ot:#2F6FB5; --ot-bg:#E2ECF8; --hol:#A93478; --hol-bg:#FAE6F0; --ev:#0E6E73;
  --shadow:none;
  --f-display:"Archivo","Anuphan",system-ui,sans-serif;
  --f-body:"Anuphan","Noto Sans Thai",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131210; --surface:#1C1B18; --surface-2:#24221E; --line:#34322C; --line-2:#2A2824;
  --fg:#F1EEE5; --muted:#A3A097; --head:#131210; --head-2:#131210; --head-fg:#F1EEE5; --head-dim:#A3A097; --head-on:#2A2824;
  --brand:#EE6A43; --brand-soft:#3A1B12; --cream:#3A362A;
  --accent:#E8AE48; --accent-soft:#33270F; --accent-line:#6B5220; --accent-fg:#1A1209;
  --bad:#F28B7A; --bad-bg:#3B1C17; --ok:#73CC93; --ok-bg:#17301F; --warn:#F2C062; --warn-bg:#352A12;
  --off:#9AA1A8; --hatch:#26241F; --ot:#7FB2EC; --ot-bg:#16273B; --hol:#F08CC4; --hol-bg:#3A1A2C; --ev:#5CC6CC; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131210; --surface:#1C1B18; --surface-2:#24221E; --line:#34322C; --line-2:#2A2824;
  --fg:#F1EEE5; --muted:#A3A097; --head:#131210; --head-2:#131210; --head-fg:#F1EEE5; --head-dim:#A3A097; --head-on:#2A2824;
  --brand:#EE6A43; --brand-soft:#3A1B12; --cream:#3A362A;
  --accent:#E8AE48; --accent-soft:#33270F; --accent-line:#6B5220; --accent-fg:#1A1209;
  --bad:#F28B7A; --bad-bg:#3B1C17; --ok:#73CC93; --ok-bg:#17301F; --warn:#F2C062; --warn-bg:#352A12;
  --off:#9AA1A8; --hatch:#26241F; --ot:#7FB2EC; --ot-bg:#16273B; --hol:#F08CC4; --hol-bg:#3A1A2C; --ev:#5CC6CC; --shadow:none; color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:invert(1) hue-rotate(180deg) saturate(1.4)}}
:root[data-theme="dark"] .logo{filter:invert(1) hue-rotate(180deg) saturate(1.4)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--head)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-stretch:112%;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}.mono{font-family:var(--f-mono)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1400px;margin:0 auto}

/* header */
header{background:var(--head);border-bottom:1px solid var(--line);color:var(--head-fg);position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.top{display:flex;align-items:center;gap:10px 14px;padding-block:12px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.logo{height:34px;width:auto;display:block}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:.2px}
.brand span{color:var(--head-dim);font-size:13px;font-weight:500;padding-left:12px;border-left:1px solid var(--line)}
.role{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--head-on);color:var(--head-fg);max-width:300px;border:0}
.role i{width:7px;height:7px;border-radius:50%;background:var(--head-dim);flex:none}
.role.edit i{background:#5BC27E}.role.local i{background:#E08A5F}
.role span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;color:var(--head-dim);padding:9px 13px 11px;font-weight:600;font-size:13.5px;white-space:nowrap;border-bottom:2px solid transparent;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--head-fg)}
.tabs button.on{color:var(--head-fg);border-bottom-color:var(--brand)}
.tabs svg{width:17px;height:17px}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:10.5px;line-height:17px;padding:0 6px;font-weight:700}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding-block:14px 0}
.bar h1{font-size:24px;font-weight:800;margin-right:auto}
select.pick,input.pick{height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-weight:600;font-size:13px;max-width:260px}
.period{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--surface);height:36px}
.period button{border:0;background:none;width:34px;height:34px;font-size:18px;color:var(--muted)}
.period span{min-width:150px;text-align:center;font-weight:600;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:0 12px;height:34px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--fg);color:var(--bg)}
.btn{height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--fg);border-color:var(--fg);color:var(--bg);border-radius:999px;padding:0 16px}
.btn.primary:hover{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn:disabled{opacity:.45;cursor:default}
.status{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:0}
.status i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.status.saving i{background:var(--warn)}.status.error i{background:var(--bad)}.status.error{color:var(--bad);cursor:pointer}

main{padding-block:0 110px}
.stack{display:grid;gap:14px;padding-top:14px}
.banner{border-radius:12px;padding:10px 14px;font-size:13px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--accent-line)}
.banner.local{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:8px 10px;padding:12px 16px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.card-h h2{font-size:16px}
.card-h .grow{margin-right:auto}
.sub{color:var(--muted);font-size:12.5px}
.pill{font-size:12px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:2px 9px;border-radius:999px;font-weight:600;white-space:nowrap}
.pill.grey{color:var(--muted);background:var(--surface-2);border-color:var(--line)}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.pad{padding:12px 16px}
.small{font-size:12px}.muted{color:var(--muted)}

/* roster */
.gridwrap{overflow:auto;max-height:calc(100vh - 250px)}
table{border-collapse:separate;border-spacing:0}
.roster{width:max-content;min-width:100%}
.roster th,.roster td{border-bottom:1px solid var(--line-2);padding:0}
.roster thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-size:11.5px;font-weight:600;color:var(--muted);padding:6px 4px;text-align:center;white-space:nowrap}
.roster thead th b{display:block;font-family:var(--f-display);font-size:15px;color:var(--fg)}
.roster thead th.we,.roster thead th.we b{color:var(--bad)}
.roster thead th.today{background:var(--accent-soft)}
.roster .mon{box-shadow:inset 2px 0 0 var(--line)}
.who{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:6px 10px!important;width:200px;min-width:170px;max-width:200px;border-right:1px solid var(--line)}
.roster thead .who{z-index:4;background:var(--surface-2)}
.who b{display:flex;align-items:center;gap:6px;font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden}
.who small{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .cond{color:var(--warn);font-weight:600}
.sortsel{display:flex;align-items:center;gap:4px;font-size:10.5px;font-weight:500;color:var(--muted);margin-top:4px}
.sortsel select{font-size:11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:1px 4px;max-width:100px}
.eid{font-size:10.5px;font-weight:500;color:var(--muted)}
.tagb{font-size:10px;font-weight:700;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:0 6px;border-radius:6px}
td.c{min-width:86px;height:50px;padding:3px!important;vertical-align:middle;position:relative}
.month td.c{min-width:46px;height:40px;padding:2px!important}
td.c.na{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 4px,var(--hatch) 4px,var(--hatch) 8px)}
.chip.nawork{background:none;border:0;color:var(--muted);font-size:10px;font-weight:600}
td.c.we{background:var(--surface-2)}
td.c button{all:unset;box-sizing:border-box;display:block;width:100%;height:100%;cursor:pointer;border-radius:8px}
td.c button:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
td.c.ro button{cursor:default}
td.c.locked{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 6px,var(--hatch) 6px,var(--hatch) 12px)}
td.c.flag button{box-shadow:inset 0 0 0 2px var(--bad)}
td.c.drafted .chip{outline:2px dashed var(--accent);outline-offset:1px}
td.c.hit{animation:hit 1.3s ease 2}
@keyframes hit{50%{background:var(--warn-bg)}}
.chip{height:100%;border-radius:8px;display:grid;place-content:center;text-align:center;line-height:1.15;padding:2px;position:relative;
  background:color-mix(in srgb,var(--c) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 38%,transparent);color:color-mix(in srgb,var(--c) 72%,var(--fg))}
.chip b{font-size:12px;font-weight:700}
.chip small{font-family:var(--f-mono);font-size:9.5px;opacity:.85}
.month .chip b{font-size:10.5px}.month .chip small{display:none}
.chip.empty{background:none;border:1px dashed var(--line);color:var(--line);font-size:15px}
.chip.dim{opacity:.3}
.chip.away{background:repeating-linear-gradient(135deg,var(--surface-2),var(--surface-2) 5px,var(--hatch) 5px,var(--hatch) 10px);border:1px dashed var(--accent-line);color:var(--muted)}
.chip.inc{box-shadow:inset 0 0 0 2px var(--accent)}
.roster thead th.hol{background:var(--hol-bg);color:var(--hol)}
.roster thead th.hol b{color:var(--hol)}
.mth{display:block;font-size:10px;font-weight:600;color:var(--muted);line-height:1.1}
.evtag{display:block;font-size:9px;font-weight:700;color:var(--ev);max-width:110px;margin:1px auto 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:help}
.evdot{color:var(--ev);cursor:help}
.evline{color:var(--ev);display:flex;flex-wrap:wrap;gap:4px 14px}
.holtag{display:block;font-size:9px;font-weight:700;color:var(--hol);max-width:80px;margin:0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.c.hol{background:color-mix(in srgb,var(--hol-bg) 55%,transparent)}
.heat th.hol{color:var(--hol);background:var(--hol-bg);border-radius:4px}
.chip .ot{font-size:9px;font-weight:700;color:var(--ot);background:var(--ot-bg);border-radius:4px;padding:0 4px;margin-top:1px}
.chip.isot{box-shadow:inset 0 0 0 2px var(--ot)}
.pill.ot{color:var(--ot);background:var(--ot-bg);border-color:transparent}
.issue.ot{border-left-color:var(--ot)}.issue.ot .t{color:var(--ot);background:var(--ot-bg)}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;font-size:inherit}
.whob{all:unset;cursor:pointer;display:block;width:100%;min-width:0}
.whob:hover b{color:var(--accent)}
.whob:focus-visible{outline:2px solid var(--accent)}
.daychip{border:1px solid var(--line);border-radius:8px;padding:4px 9px}
.sheet.wide{max-width:760px}
.cfgshifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px}
.cfgsh{display:flex;align-items:center;justify-content:space-between;gap:6px;border-bottom:1px solid var(--line-2);padding:2px 0}
.cfgsh .bx{white-space:nowrap;min-width:0;overflow:hidden}
.cfgsh .bx .mono{font-size:10.5px}
.cfgsh select{height:30px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 6px;font-size:12px}
.tgt{border-spacing:3px}
.tgt th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:center;padding:0 2px;white-space:nowrap}
.tgt tbody th{text-align:left;color:var(--fg)}
.tgt input{width:44px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:center}
.tgt td:nth-last-child(-n+2) input{background:var(--accent-soft);border-color:var(--accent-line)}
.chip .to{font-size:9.5px;font-weight:700;color:var(--accent)}
.roster tr.sep td{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12px;padding:5px 10px!important}
.roster tfoot td{position:sticky;bottom:0;background:var(--surface-2);font-size:11.5px;text-align:center;padding:4px 2px!important;border-top:1px solid var(--line)}
.roster tfoot tr:first-child td{border-top:2px solid var(--line)}
.roster tfoot .who{z-index:3;font-size:12px}
.cov{display:inline-block;min-width:36px;border-radius:6px;padding:1px 4px;font-weight:700}
.cov.s{background:var(--bad-bg);color:var(--bad)}.cov.k{background:var(--ok-bg);color:var(--ok)}.cov.o{background:var(--warn-bg);color:var(--warn)}.cov.n{color:var(--fg)}
.mv{display:block;font-size:9.5px;font-weight:700}.mv .i{color:var(--ok)}.mv .o{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 16px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;background:color-mix(in srgb,var(--c) 25%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 50%,transparent)}
.empty-state{padding:40px 20px;text-align:center;color:var(--muted)}
.empty-state b{display:block;color:var(--fg);font-size:15px;margin-bottom:6px}

/* issues */
.issue{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 16px;border:0;border-bottom:1px solid var(--line-2);border-left:3px solid var(--bad);background:none;text-align:left;width:100%}
.issue:hover{background:var(--surface-2)}
.issue .t{font-size:11px;font-weight:700;color:var(--bad);background:var(--bad-bg);border-radius:6px;padding:1px 7px;white-space:nowrap}
.issue.w{border-left-color:var(--warn)}.issue.w .t{color:var(--warn);background:var(--warn-bg)}
.ok-line{padding:14px 16px;color:var(--ok);font-weight:600}

/* overview */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;display:grid;gap:2px}
.kpi span{font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--f-display);font-stretch:112%;font-weight:800;font-size:32px;line-height:1.1}
.kpi.bad b{color:var(--bad)}
.heat{border-spacing:2px;width:max-content}
.heat th{font-size:10.5px;color:var(--muted);font-weight:600;padding:2px;text-align:center;line-height:1.2}
.heat th.we{color:var(--bad)}
.heat td{width:32px;height:28px;text-align:center;font-size:11.5px;font-weight:700;border-radius:5px}
.heat td.name{width:auto;text-align:left;padding:0 10px 0 0;white-space:nowrap;position:sticky;left:0;background:var(--surface);font-weight:500;font-size:12.5px;z-index:1}
.heat td.name button{all:unset;cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.heat td.name button:hover span{color:var(--accent);text-decoration:underline}
.bcode{font-family:var(--f-mono);font-size:10.5px;color:var(--bg);background:var(--fg);padding:1px 6px;border-radius:5px}
.heat td.zone{text-align:left;color:var(--muted);font-size:11px;padding-top:10px;position:sticky;left:0;background:var(--surface);font-weight:600}
.heat .s{background:var(--bad-bg);color:var(--bad)}.heat .k{background:var(--ok-bg);color:var(--ok)}.heat .o{background:var(--warn-bg);color:var(--warn)}.heat .n{background:var(--surface-2);color:var(--muted)}
.xscroll{overflow-x:auto}

/* forms, lists */
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;padding:14px 16px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.input{width:100%;height:38px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.list{border-collapse:collapse;width:100%}
.list th,.list td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);font-size:13px;white-space:nowrap}
.list th{font-size:11.5px;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0;z-index:1}
.list .n{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow:auto;max-height:64vh}
.edit td{padding:4px 6px}
.edit input,.edit select{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);padding:0 8px;width:100%;min-width:70px}
.edit input.dup{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-bg);background:var(--bad-bg)}
.pbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--accent-soft);border-bottom:1px solid var(--accent-line)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 18px}
.cgrid .row{gap:2px 8px}
.subtabs{display:flex;gap:2px;padding:6px 12px 0;border-bottom:1px solid var(--line-2);overflow-x:auto}
.subtabs button{border:0;background:none;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button.on{color:var(--fg);border-bottom-color:var(--accent)}
.distbar{display:flex;height:14px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.distbar i{display:block;height:100%;background:var(--c)}
.distleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.distleg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.acc{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px}
.acc .er{display:flex;align-items:center;gap:8px}
.acc .er b{margin-right:auto}
.presets{display:flex;flex-wrap:wrap;gap:6px}
.presets button{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:3px 9px;font-size:11.5px;font-weight:600;color:var(--muted)}
.bxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 6px}
.bx{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 4px;border-radius:6px;cursor:pointer}
.bx:hover{background:var(--surface-2)}
.search{position:relative}
.sres{border:1px solid var(--line);border-radius:9px;margin-top:4px;max-height:180px;overflow:auto;background:var(--surface)}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px}
.sres button:hover{background:var(--surface-2)}
.note{font-size:12px;color:var(--warn);background:var(--warn-bg);border-radius:9px;padding:9px 12px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(20,12,6,.45);z-index:80;display:grid;place-items:center;padding:16px}
.sheet{background:var(--surface);border-radius:16px;width:100%;max-width:460px;max-height:88vh;overflow:auto;box-shadow:0 30px 70px -20px rgba(0,0,0,.6);display:grid;gap:14px;padding:18px}
.sheet h3{font-size:17px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.sgrid button{border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:color-mix(in srgb,var(--c) 14%,var(--surface));color:color-mix(in srgb,var(--c) 75%,var(--fg));border-radius:9px;padding:7px 5px;display:grid;gap:1px;text-align:center}
.sgrid button b{font-size:13px}
.sgrid button small{font-family:var(--f-mono);font-size:10px;opacity:.85}
.sgrid button.cur{box-shadow:0 0 0 2px var(--fg)}
.sgrid button.bad{opacity:.55}
.sgrid button:disabled{opacity:.3;cursor:not-allowed}
.sglabel{font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:-6px}
.warnline{font-size:12.5px;border-radius:9px;padding:8px 10px;background:var(--bad-bg);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:10px;z-index:90;font-size:13px;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.foot{color:var(--muted);font-size:12px;padding-top:14px}

/* phone */
.tabbar{display:none}
@media (max-width:820px){
  header .tabs{display:none}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{border:0;background:none;color:var(--head-dim);display:grid;justify-items:center;gap:2px;padding:8px 2px 7px;font-size:10.5px;font-weight:600;position:relative}
  .tabbar button.on{color:var(--fg)}
  .tabbar button.on svg{color:var(--brand)}
  .tabbar svg{width:21px;height:21px}
  .tabbar .badge{position:absolute;top:3px;left:56%;font-size:9px;line-height:15px;padding:0 5px}
  .brand span{display:none}
  .bar h1{width:100%;font-size:18px}
  .period span{min-width:110px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form{grid-template-columns:1fr 1fr}
  .form .wide{grid-column:1/-1}
  .gridwrap{max-height:calc(100vh - 300px)}
  .who{min-width:118px;max-width:132px;padding:4px 8px!important}
  td.c{min-width:66px}
  .who{width:124px}
  .backdrop{place-items:end center;padding:0}
  .sheet{max-width:none;border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){td.c.drafted .chip{outline:2px dashed var(--accent);outline-offset:1px}
td.c.hit{animation:none;background:var(--warn-bg)}}
</style>
</head>

  else if (d.brt) { const [i, g] = d.brt.split('|'); S.draft.branches[+i].t[g] = t.value; }
  else if (d.set) { S.draft.settings[d.set] = t.value; }
  else if (d.lg !== undefined) { const st = S.draft.settings; st.leadGroups = GROUPS.filter(g => { const el = document.querySelector(`[data-lg="${g}"]`); return el && el.checked; }); }
  else if (d.ox !== undefined) { S.draft.settings.otExemptPos = [...document.querySelectorAll('[data-ox]')].filter(x => x.checked).map(x => x.dataset.ox); }
  else if (d.lp !== undefined) { const st = S.draft.settings; st.leadPos = [...document.querySelectorAll('[data-lp]')].filter(x => x.checked).map(x => x.dataset.lp); }
  else if (d.sc) { const [i, k] = d.sc.split('|'); S.draft.shiftCat[+i][k] = t.value; }
  else if (d.ev) { const [i, k] = d.ev.split('|'); S.draft.events[+i][k] = t.value; if (k === 'rep') render(); }
  else if (d.hl) { const [i, k] = d.hl.split('|'); S.draft.holidays[+i][k] = t.value; }
  else if (d.cd) { const [i, k] = d.cd.split('|'); S.draft.conds[+i][k] = t.value; }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeSheet(); });
addEventListener('beforeunload', () => { if (PENDING.size) flush(); });

boot();
</script>
